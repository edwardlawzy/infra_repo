apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-backend
  labels:
    app: dependency-track
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dependency-track
      component: backend
  template:
    metadata:
      labels:
        app: dependency-track
        component: backend
    spec:
      containers:
      - name: backend
###        image: 
        ports:
        - containerPort: 8080
        env:
        - name: JAVA_OPTIONS
          value: "-Xmx2g -Xms1g -XX:+UseG1GC"
        livenessProbe:
          httpGet:
            path: /api/version
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/version
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
